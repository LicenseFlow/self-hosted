{{- if .Values.networkPolicy.enabled }}
---
# Default-deny: nothing in/out unless an explicit policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseflow.fullname" . }}-default-deny
  labels:
    {{- include "licenseflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "licenseflow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Allow inbound HTTP from the configured ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseflow.fullname" . }}-allow-ingress
  labels:
    {{- include "licenseflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "licenseflow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - port: 80
          protocol: TCP
        - port: 8000
          protocol: TCP
---
# Allow egress to bundled Postgres + Redis (same namespace), kube-DNS, and
# any extra CIDRs the operator opts into.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "licenseflow.fullname" . }}-allow-egress
  labels:
    {{- include "licenseflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "licenseflow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # kube-DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressCIDRs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}