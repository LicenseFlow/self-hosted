# LicenseFlow Helm Chart Values
# Override these values for your deployment

# ═══════════════════════════════════════════════════════════════
# APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════

replicaCount: 2

image:
  repository: licenseflow/self-hosted
  tag: "latest"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application settings
config:
  appUrl: "https://licenses.example.com"
  nodeEnv: "production"
  logLevel: "info"

# ═══════════════════════════════════════════════════════════════
# SECRETS
# ═══════════════════════════════════════════════════════════════

secrets:
  # When false, the chart does not render its own Secret object. Use this when
  # secrets are managed externally (External Secrets Operator, Vault Agent,
  # SealedSecrets, etc.) and surfaced via `secrets.existingSecret` below.
  create: true

  # REQUIRED: Set via --set or external secret manager (Vault, AWS Secrets Manager)
  # Deployment will fail if jwtSecret is not provided
  jwtSecret: ""
  
  # Use existingSecret to reference a pre-created Kubernetes Secret
  existingSecret: ""
  
  # Stripe integration (optional)
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  
  # SMTP configuration (optional)
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpPass: ""
  smtpFrom: "noreply@example.com"

# ═══════════════════════════════════════════════════════════════
# SERVICE & NETWORKING
# ═══════════════════════════════════════════════════════════════

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: licenses.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: licenseflow-tls
      hosts:
        - licenses.example.com

# ═══════════════════════════════════════════════════════════════
# RESOURCES & SCALING
# ═══════════════════════════════════════════════════════════════

# Split per-workload resource budgets so a runaway cron or backup job cannot
# starve the API pods. `resources` (legacy) is kept for backwards compatibility
# and applied to the main app container when `resources.api` is empty.
resources:
  api:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  cron:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  test:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ═══════════════════════════════════════════════════════════════
# HEALTH CHECKS
# ═══════════════════════════════════════════════════════════════

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

# ═══════════════════════════════════════════════════════════════
# POSTGRESQL
# ═══════════════════════════════════════════════════════════════

postgresql:
  enabled: true
  auth:
    username: licenseflow
    password: ""  # REQUIRED: Set via --set or existingSecret
    database: licenseflow
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# External database (if postgresql.enabled is false)
externalDatabase:
  host: ""
  port: 5432
  database: licenseflow
  username: licenseflow
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: ""

# ═══════════════════════════════════════════════════════════════
# REDIS
# ═══════════════════════════════════════════════════════════════

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# External Redis (if redis.enabled is false)
externalRedis:
  host: ""
  port: 6379
  password: ""

# ═══════════════════════════════════════════════════════════════
# POD SETTINGS
# ═══════════════════════════════════════════════════════════════

podAnnotations: {}

# Secure-by-default pod-level security context. Overridable.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Secure-by-default container-level security context.
#
# `readOnlyRootFilesystem` is OFF by default because the bundled image writes
# to /var/cache/nginx, /var/log, and /usr/share/nginx/html at boot. Operators
# who want a fully read-only root can flip this on and add the matching
# emptyDir mounts under `extraVolumes` / `extraVolumeMounts`. See the README.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# Optional extra volumes / mounts for read-only-rootfs deployments or custom
# CA bundles. Rendered verbatim into the Pod spec / container spec.
extraVolumes: []
extraVolumeMounts: []

# Network isolation. Default-deny ingress + egress with explicit allow rules
# for ingress controller, intra-chart Postgres/Redis, and kube-DNS.
networkPolicy:
  enabled: true
  # Namespace label that identifies the ingress controller. Override for
  # non-standard installs (e.g. Traefik, HAProxy, OpenShift Router).
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Allow-list of additional egress CIDRs (Stripe, SMTP relays, S3, etc.).
  # Example:
  #   extraEgressCIDRs:
  #     - 169.254.169.254/32   # cloud metadata (avoid!)
  #     - 0.0.0.0/0            # open egress (not recommended)
  extraEgressCIDRs: []

# Optional helm test configuration. The test pod issues an HTTP GET against
# the /health endpoint and optionally verifies a known license key.
tests:
  enabled: true
  # If set, the test pod will additionally call the public license verify
  # endpoint with this key and assert a 200 response.
  licenseKey: ""
  image:
    repository: curlimages/curl
    tag: "8.10.1"

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: licenseflow
          topologyKey: kubernetes.io/hostname

# ═══════════════════════════════════════════════════════════════
# MAINTENANCE
# ═══════════════════════════════════════════════════════════════

cronjobs:
  cleanupExpiredLeases:
    enabled: true
    schedule: "*/5 * * * *"
  cleanupExpiredSessions:
    enabled: true
    schedule: "0 * * * *"

# ═══════════════════════════════════════════════════════════════
# MONITORING
# ═══════════════════════════════════════════════════════════════

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s

# ═══════════════════════════════════════════════════════════════
# BACKUP & DISASTER RECOVERY
# See self-hosted/DISASTER-RECOVERY.md for full documentation
# ═══════════════════════════════════════════════════════════════

backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 30
  s3:
    bucket: ""
    region: ""
    accessKey: ""
    secretKey: ""

# ═══════════════════════════════════════════════════════════════
# DISASTER RECOVERY
# ═══════════════════════════════════════════════════════════════

disasterRecovery:
  enabled: false
  # PostgreSQL streaming replication
  replication:
    enabled: false
    readReplicas: 0
  # Automatic failover with Patroni
  failover:
    enabled: false
  # Multi-region support
  multiRegion:
    enabled: false
    regions: []
