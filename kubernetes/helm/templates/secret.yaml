{{- if and (default true .Values.secrets.create) (not .Values.secrets.existingSecret) }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "\n\nERROR: secrets.jwtSecret is required.\n  - Generate one with: openssl rand -base64 48\n  - Pass via: --set secrets.jwtSecret=$(openssl rand -base64 48)\n  - Or reference a pre-created Secret via secrets.existingSecret\n  - Or set secrets.create=false if managing secrets externally (Vault, ESO, SealedSecrets)\n" }}
{{- end }}
{{- if lt (len .Values.secrets.jwtSecret) 32 }}
{{- fail "ERROR: secrets.jwtSecret must be at least 32 characters." }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.password) }}
{{- fail "ERROR: postgresql.auth.password is required when postgresql.enabled=true. Set via --set postgresql.auth.password=$(openssl rand -base64 24)." }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) (not .Values.externalDatabase.password) }}
{{- fail "ERROR: externalDatabase.password (or externalDatabase.existingSecret) is required when postgresql.enabled=false." }}
{{- end }}
{{- if and .Values.secrets.stripeSecretKey (not .Values.secrets.stripeWebhookSecret) }}
{{- fail "ERROR: secrets.stripeWebhookSecret is required when secrets.stripeSecretKey is set (used to verify Stripe webhook signatures)." }}
{{- end }}
{{- if and .Values.secrets.smtpHost (not .Values.secrets.smtpPass) }}
{{- fail "ERROR: secrets.smtpPass is required when secrets.smtpHost is set." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "licenseflow.fullname" . }}
  labels:
    {{- include "licenseflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ include "licenseflow.databaseUrl" . | quote }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpHost }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}
  SMTP_FROM: {{ .Values.secrets.smtpFrom | quote }}
  {{- end }}
{{- end }}
